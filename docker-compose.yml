# OpenSearch for the knowledge demo. Single node, no security: for local use only.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: km-demo-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9209:9200"
    volumes:
      - km-demo-data:/usr/share/opensearch/data
volumes:
  km-demo-data:
